    <linearGradient id="fade" x1="0" y1="227" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".23"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
    <mask id="floor" maskUnits="userSpaceOnUse" x="0" y="226" width="240" height="94"><rect y="226" width="240" height="94" fill="url(#fade)"/></mask>
