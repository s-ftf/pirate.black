name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh local publication, video, and X metadata
        run: python3 scripts/update-media.py
      - name: Check the final files before publishing
        run: python3 scripts/check-site.py
      - name: Stage public files
        run: |
          mkdir _site
          cp index.html varrr.html robots.txt sitemap.xml llms.txt .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
